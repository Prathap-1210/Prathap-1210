<svg width="900" height="100" viewBox="0 0 900 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated developer roles">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e7ff"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .role { font: 600 23px 'Segoe UI', Arial, sans-serif; fill: url(#neon); text-anchor: middle; opacity: 0; filter: url(#glow); }
      .r1 { animation: show 15s infinite 0s; }
      .r2 { animation: show 15s infinite 3s; }
      .r3 { animation: show 15s infinite 6s; }
      .r4 { animation: show 15s infinite 9s; }
      .r5 { animation: show 15s infinite 12s; }
      @keyframes show { 0% { opacity: 0; transform: translateY(8px); } 4%, 16% { opacity: 1; transform: translateY(0); } 20%, 100% { opacity: 0; transform: translateY(-8px); } }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="900" height="100" rx="16" fill="#020617"/>
  <rect x="1" y="1" width="898" height="98" rx="15" fill="none" stroke="url(#neon)" stroke-opacity=".45"/>
  <circle class="pulse" cx="32" cy="50" r="4" fill="#00e7ff"/>
  <circle class="pulse" cx="868" cy="50" r="4" fill="#8b5cf6"/>
  <g transform="translate(0 8)">
    <text class="role r1" x="450" y="50">AI &amp; DATA SCIENCE STUDENT</text>
    <text class="role r2" x="450" y="50">ASPIRING FULL-STACK DEVELOPER</text>
    <text class="role r3" x="450" y="50">BUILDING FLOODTWIN &amp; ACQUITWIN AI</text>
    <text class="role r4" x="450" y="50">PROBLEM SOLVER &amp; AI BUILDER</text>
    <text class="role r5" x="450" y="50">TURNING IDEAS INTO IMPACT</text>
  </g>
</svg>
